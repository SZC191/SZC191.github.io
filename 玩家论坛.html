<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>玩家论坛</title>
    <style>
        body {font-family:Arial,sans-serif;margin:0;padding:20px;background:#fafafa;}
        .header {font-size:24px;font-weight:bold;color:#333;margin-bottom:20px;}
        .comment-section {margin-top:10px;}
        .comment-input {width:100%;padding:8px;box-sizing:border-box;margin-bottom:8px;}
        .comment-btn {padding:6px 12px;background:#0066cc;color:#fff;border:none;cursor:pointer;}
        .comment-btn:hover {background:#004499;}
        .comment-list {margin-top:20px;}
        .comment-item {
            padding:8px;
            border-bottom:1px solid #e0e0e0;
            background:#fff;
            margin-bottom:5px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }
        .del-btn {
            background:#e74c3c;
            color:#fff;
            border:none;
            padding:2px 6px;
            cursor:pointer;
            font-size:12px;
            border-radius:3px;
        }
        .del-btn:hover {background:#c0392b;}
    </style>
</head>
<body>
    <div class="header">玩家论坛</div>

    <div class="comment-section">
        <h3>留言评论</h3>
        <textarea id="commentInput" class="comment-input" rows="3" placeholder="在此输入你对游戏的看法，意见或感受..."></textarea><br>
        <button class="comment-btn" onclick="addComment()">发送</button>

        <div id="commentList" class="comment-list"></div>
    </div>

    <script>
        const STORAGE_KEY = 'forumComments';

        // 读取本地存储的评论
        function loadComments() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        // 保存评论到本地存储
        function saveComments(comments) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(comments));
        }

        // 渲染评论列表（每条带删除按钮）
        function renderComments() {
            const listEl = document.getElementById('commentList');
            const comments = loadComments();
            listEl.innerHTML = '';

            comments.forEach((text, idx) => {
                const item = document.createElement('div');
                item.className = 'comment-item';

                const span = document.createElement('span');
                span.textContent = text;

                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.textContent = '删除';
                delBtn.onclick = () => deleteComment(idx);

                item.appendChild(span);
                item.appendChild(delBtn);
                listEl.appendChild(item);
            });
        }

        // 添加新评论
        function addComment() {
            const input = document.getElementById('commentInput');
            const text = input.value.trim();
            if (!text) return;

            const comments = loadComments();
            comments.push(text);
            saveComments(comments);
            input.value = '';
            renderComments();
        }

        // 删除指定索引的评论
        function deleteComment(index) {
            const comments = loadComments();
            if (index < 0 || index >= comments.length) return;
            comments.splice(index, 1);          // 移除该条
            saveComments(comments);
            renderComments();
        }

        // 页面加载完成后渲染已有评论
        window.onload = renderComments;
    </script>
</body>
</html>
