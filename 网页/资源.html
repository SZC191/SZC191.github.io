<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>资源 - sleep模拟器</title>
    <style>
        body {font-family:Arial,sans-serif;margin:0;padding:20px;max-width:800px;margin:auto;color:#333;background:#fafafa;}
        header {background:#f4f4f4;padding:20px;text-align:center;border-bottom:1px solid #ddd;}
        a {color:#0066cc;text-decoration:none;transition:color .3s;}
        a:hover {color:#004499;text-decoration:underline;}
        footer {text-align:center;padding:10px;background:#f4f4f4;border-top:1px solid #ddd;margin-top:30px;}
        .section {margin-top:30px;}
        .section h3 {margin-bottom:10px;}
        ul {margin-left:20px;}
        .font-converter {margin-top:30px;padding:20px;background:#fff;border:1px solid #ddd;border-radius:5px;}
        .font-converter textarea {width:100%;height:80px;padding:8px;font-size:14px;resize:none;}
        .font-converter select {margin-top:10px;padding:5px;}
        .preview {margin-top:15px;padding:10px;border:1px dashed #bbb;background:#fff;min-height:40px;}
        /* ---------- 引入完整中文书法字体（TTF） ---------- */
        @font-face {
            font-family: "KaiTi";
            src: url("https://cdn.jsdelivr.net/gh/zhangxinxu/zh-fonts@latest/kaiti.ttf") format("truetype");
        }
        @font-face {
            font-family: "LiShu";
            src: url("https://cdn.jsdelivr.net/gh/zhangxinxu/zh-fonts@latest/lishu.ttf") format("truetype");
        }
        @font-face {
            font-family: "ZhuanShu";
            src: url("https://cdn.jsdelivr.net/gh/zhangxinxu/zh-fonts@latest/zhuanshu.ttf") format("truetype");
        }
    </style>
</head>
<body>
    <header>
        <h1>资源中心</h1>
    </header>

    <!-- 游戏本体下载 -->
    <div class="section">
        <h3>游戏本体下载</h3>
        <ul>
            <li><a href="https://learn.coduck.cn/#/student/works/scratch3/edit?source=%E5%88%9B%E4%BD%9C&id=16b534f4-d58a-4abf-8df0-0ed22094eec1&VNK=66ee8020" target="_blank">
                Scratch 作品页面（直接下载）
            </a></li>
        </ul>
    </div>

    <!-- 汉字字体转换器 -->
    <div class="font-converter">
        <h3>汉字字体转换器</h3>
        <textarea id="inputText" placeholder="该功能正在完善…"></textarea>
        <br>
        <select id="fontSelect">
            <option value="Arial, sans-serif">系统宋体（默认）</option>
            <option value="KaiTi">楷书（KaiTi）</option>
            <option value="LiShu">隶书（LiShu）</option>
            <option value="ZhuanShu">篆书（ZhuanShu）</option>
        </select>
        <div class="preview" id="previewArea">该功能正在完善…</div>
    </div>

    <footer>
        <p>&copy; 2024.13 SZC的网站. 保留所有权利.</p>
        <p><a href="index.html">返回主站</a></p>
    </footer>

    <script>
        const txt  = document.getElementById('inputText');
        const sel  = document.getElementById('fontSelect');
        const prev = document.getElementById('previewArea');

        function updatePreview() {
            const text = txt.value.trim() || '预览文字将显示在此处';
            const font = sel.value;
            // 使用 setProperty 加上 !important 防止被其他样式覆盖
            prev.style.setProperty('font-family', font, 'important');
            prev.textContent = text;
        }

        txt.addEventListener('input', updatePreview);
        sel.addEventListener('change', updatePreview);
        // 初始化一次
        updatePreview();
    </script>
</body>
</html>
